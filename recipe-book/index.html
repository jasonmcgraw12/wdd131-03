<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A recipe book with search functions">
    <title>Recipe Book</title>

    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                
</head>
<body>
    <main>
        <div id="title">
            <img id="logo" src="images/recipe-book.png" alt="Image of recipe book">
            <h1>Recipe Book</h1>
        </div>
        <search id="search">
            <label for="search-bar"></label>
            <input name="search-bar" type="search">

            <hr>
            <button aria-label="search button"><img id="magnifying" src="images/search.svg" alt="Magnifying glass"></button>
        </search>
        <div class="bordered">
            <img class="recipe-picture" src="images/apple-crisp.jpg" alt="Apple crisp image">
            <div class="info">
                <button aria-label="link to recipe">dessert</button>
                <h2>Apple Crisp</h2>
                <div class="text-box">
                    <p role="img" aria-label="4 out of 5 stars">Rating: ⭐⭐⭐⭐☆</p>
                </div>
                <div class="text-box">
                    <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla icecream.</p>
                </div>
            </div>
        </div>
    </main>
    

    <footer>
        <div id="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img class="sm-icon" src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img class="sm-icon" src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img class="sm-icon" src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>   
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>                   
    </footer>
</body>
</html>
